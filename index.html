<!DOCTYPE html>
<html>
    <head>
        <title>clicker de bolo</title>
        <style>

            * {
               margin: 0; 
               box-sizing: border-box;
            }
            img.bolo1 {
                display: flex;
                width: 200px;
                background: #e1b667;
                padding: 15px;
                border-radius: 60px;
            }
            body {
                min-height: 100vh;
                box-sizing: border-box;
            }
            p#numero {
                font-size: 100px;
                background: #e1b667; 
                padding: 15px;
                border-radius: 60px;
            }
            p.a1 {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            div.boloMeio {
                background-image: url(img/fundo\ bolo.png);
                place-items: center;
                border: 5px solid black;
                min-height: 100vh;
                box-sizing: border-box;
                width: 450px;
            }
            .conjunto {
                display: flex;
                gap: 30px;
            }
            .upgrades {
                background-image: url(img/fundo\ upgrade.png);
                padding: 10px;
                border: solid black;
                display: flex;
            }
            button {
                width: 100px;
                padding: 10px;
                height: 50px;
            }
            .botão1 {
                place-items: center;
                display: flex;
                background: #888;
                height: 50px;
                padding: 30px;
                gap: 25px;
                border: solid black 2px;
            }
            .custbut {
                background: #666;
                padding: 5px;
                place-items: center;
                display: flex;
                gap: 40px;
            }
            
        </style>
    </head>
    <body>

    <div class="conjunto">
        <div class="upgrades">
            <div class="botão1">
                <p>Colher descartável</p>
                <br>
                <div class="custbut">
                    <p class="custo">custo:100</p>
                    <button class=" button">comprar</button>
                </div>
                
            </div>
        </div>

        <div class="boloMeio">
        <h1>confeitaria</h1>
        <p class="a1">bolo de baunilha <br>
            <img class="bolo1" src="img/bolo1 258px.png" alt="bolo baunilha" onclick="incrementa()"></p>
            <p id="numero">0</p>
        </div>
    </div>        


            <script>
                let numero = 0;

                function incrementa() {
                    numero++;
                    render();
                }

                function render() {
                    const p = document.querySelector("#numero");
                    p.innerText = numero;
                }

                render();

            </script>
        </body>
</html>
