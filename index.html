<!DOCTYPE html>
<html>
    <head>
        <title>clicker de bolo</title>
        <style>


            img.bolo1 {
                display: flex;
                width: 200px;
                
            }
            body {
                min-height: 100vh;
                place-items: center;
                margin: 0;
                box-sizing: border-box;
            }
            p#numero {
                font-size: 100px;
            }



        </style>
    </head>
    <body>
        <h1>bolo de chocolate</h1>
        <p>bolo de baunilha <br>
            <img class="bolo1" src="img/bolo1 258px.png" alt="bolo baunilha" onclick="incrementa()"></p>
            <p id="numero">0</p>



            <script>
                let numero = 0;

                function incrementa() {
                    numero++;
                    render();
                }

                function render() {
                    const p = document.querySelector("#numero");
                    p.innerText = numero;
                }

                render();
            </script>
        </body>
</html>
