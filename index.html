<!DOCTYPE html>
<html>
    <head>
        <title>clicker de bolo</title>
        <style>

            * {
                
            }
            img.bolo1 {
                display: flex;
                width: 200px;
                
            }
            body {
                min-height: 100vh;
                place-items: center;
                margin: 0;
                box-sizing: border-box;
            }
            p#numero {
                font-size: 100px;
            }
            p.a1 {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            div {
                place-items: center;
                border: 5px solid black;
                min-height: 100vh;
                margin: 0;
                box-sizing: border-box;
                width: 400px;
            }




        </style>
    </head>
    <body>

        <div>
        <h1>confeitaria</h1>
        <p class="a1">bolo de baunilha <br>
            <img class="bolo1" src="img/bolo1 258px.png" alt="bolo baunilha" onclick="incrementa()"></p>
            <p id="numero">0</p>
        </div>


            <script>
                let numero = 0;

                function incrementa() {
                    numero++;
                    render();
                }

                function render() {
                    const p = document.querySelector("#numero");
                    p.innerText = numero;
                }

                render();

            </script>
        </body>
</html>
